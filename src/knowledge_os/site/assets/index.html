<!doctype html>
<html lang="{{LANGUAGE}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="{{SITE_DESCRIPTION}}">
    <meta name="robots" content="{{ROBOTS_META}}">
    <meta name="theme-color" content="#141f31">
    <title>{{SITE_TITLE}}</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./assets/styles.css">
    <script src="./assets/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#knowledge-content">跳到知识内容</a>
    <div class="app-frame" id="app" aria-busy="true">
      <header class="topbar">
        <a class="brand" href="#node=root" aria-label="返回知识体系首页">
          <span class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span>
            <strong id="site-title">{{SITE_TITLE}}</strong>
            <small>PERSONAL KNOWLEDGE OS</small>
          </span>
        </a>

        <button class="search-trigger" id="search-trigger" type="button" aria-haspopup="dialog">
          <span aria-hidden="true">⌕</span>
          <span>搜索全部知识</span>
          <kbd>⌘ K</kbd>
        </button>

        <div class="topbar-meta">
          <span class="connection-dot" id="connection-dot" title="网络状态"></span>
          <span class="privacy-badge" id="privacy-badge">私密知识库</span>
          <time id="updated-at">正在载入</time>
        </div>
      </header>

      <nav class="module-nav" aria-label="一级专业模块">
        <div class="module-list" id="module-list"></div>
        <button class="map-toggle" id="map-toggle" type="button">
          <span aria-hidden="true">⌘</span>
          <span>关系地图</span>
        </button>
      </nav>

      <main class="workspace">
        <aside class="tree-panel panel" id="tree-panel" aria-label="专业母子目录">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">专业树</span>
              <h2>知识目录</h2>
            </div>
            <button class="icon-button" id="collapse-tree" type="button" aria-label="折叠全部目录">−</button>
          </div>
          <div class="tree-scroll">
            <ul class="knowledge-tree" id="knowledge-tree"></ul>
          </div>
          <div class="tree-legend">
            <span><i class="legend-dot locked"></i>稳定骨架</span>
            <span><i class="legend-dot generated"></i>自动扩展</span>
          </div>
        </aside>

        <section class="content-panel panel" id="knowledge-content" tabindex="-1">
          <nav class="breadcrumbs" id="breadcrumbs" aria-label="当前专业路径"></nav>
          <div id="content-view">
            <div class="loading-state">
              <span class="loading-mark" aria-hidden="true"></span>
              <h1>正在组织你的知识体系</h1>
              <p>载入专业目录、知识文档与来源证据……</p>
            </div>
          </div>
        </section>

        <aside class="context-panel panel" id="context-panel" aria-label="来源与辅助关系">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">上下文</span>
              <h2>证据与关联</h2>
            </div>
            <button class="icon-button context-close" id="close-context" type="button" aria-label="关闭上下文面板">×</button>
          </div>
          <div class="context-scroll" id="context-view">
            <div class="empty-context">
              <span aria-hidden="true">◎</span>
              <p>选择一篇知识笔记，查看来源证据与跨领域关系。</p>
            </div>
          </div>
        </aside>
      </main>

      <nav class="mobile-tabs" aria-label="移动端视图切换">
        <button type="button" data-panel="tree" aria-pressed="false">目录</button>
        <button type="button" data-panel="content" aria-pressed="true">知识</button>
        <button type="button" data-panel="context" aria-pressed="false">证据</button>
      </nav>
    </div>

    <section class="search-dialog" id="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-title" hidden>
      <div class="search-backdrop" data-close-search></div>
      <div class="search-card">
        <div class="search-head">
          <label for="search-input" id="search-title">搜索全部知识</label>
          <button type="button" class="icon-button" data-close-search aria-label="关闭搜索">×</button>
        </div>
        <div class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" autocomplete="off" placeholder="输入概念、标题、标签或专业路径">
          <kbd>ESC</kbd>
        </div>
        <div class="search-hint" id="search-hint">输入关键词开始搜索；支持中文连续匹配。</div>
        <ol class="search-results" id="search-results"></ol>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <noscript>
      <div class="noscript">这个知识库需要 JavaScript 才能浏览目录、搜索和关系地图。</div>
    </noscript>
  </body>
</html>
